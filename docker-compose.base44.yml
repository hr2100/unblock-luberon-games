services:
  web:
    image: node:22-alpine
    working_dir: /app
    labels:
      base44.project: Luberon Games
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      # Platform-provided: Vite >= 6.1 appends this to server.allowedHosts so the
      # preview proxy host is accepted. Passed bare so the platform value wins.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null --timeout=3 http://127.0.0.1:3000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  web_node_modules:
